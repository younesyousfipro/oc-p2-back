spring:
  application:
    name: etudiant-backend
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}

logging:
  level:
    org:
      hibernate:
        type: info
      springframework:
        web:
          filter:
            CommonsRequestLoggingFilter: info
    com:
      openclassrooms:
        etudiant: info

management:
  endpoints:
    web:
      exposure:
        include: '*'

# task2 - JWT implementation - le secret est lu depuis .env, meme pattern que les
# credentials de la base (DB_USER, DB_PASSWORD...). Passer par application.yml plutot
# que de lire JWT_SECRET directement permet de le surcharger dans les tests.
jwt:
  secret: ${JWT_SECRET}
